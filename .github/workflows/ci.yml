name: CI

# Hosted-minutes policy (see the PR that introduced it): the free GitHub
# Actions quota is 2000 minutes a month and a macOS minute bills ten. The
# macOS leg therefore never runs on pull requests: it runs after a push to
# main, on a weekly schedule and on release tags, and only once the Linux leg
# is green. Repo variables:
#   OPENEXEC_LINUX_RUNNER  runner for the Linux leg (default ubuntu-latest)
#   OPENEXEC_MACOS_RUNNER  runner for the macOS leg (default macos-latest);
#                          the value `none` skips the leg.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '17 4 * * 1'

# A newer push to the same pull request supersedes the older run. Pushes to
# main, tags and the schedule are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub forces JS actions onto Node 24 on 2026-06-16; opt in now so any
# breakage (golangci-lint-action@v8 still declares Node 20) surfaces while
# we're watching, not on the flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # The check name stays `build (ubuntu-latest, 1.25)` whatever runner the
    # variable selects.
    runs-on: ${{ vars.OPENEXEC_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.25']
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/build-test
      with:
        go-version: ${{ matrix.go-version }}

  # The job name is fixed to the old matrix check name so anything that
  # resolves `build (macos-latest, 1.25)` still finds it. When the leg is not
  # wanted it is reported as skipped, which satisfies a required check.
  build-macos:
    name: build (macos-latest, 1.25)
    needs: build
    if: github.event_name != 'pull_request' && (vars.OPENEXEC_MACOS_RUNNER || 'macos-latest') != 'none'
    runs-on: ${{ vars.OPENEXEC_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/build-test
      with:
        go-version: '1.25'
