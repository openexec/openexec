name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub forces JS actions onto Node 24 on 2026-06-16; opt in now so any
# breakage (golangci-lint-action@v8 still declares Node 20) surfaces while
# we're watching, not on the flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Owner, 10-23: Linux leg on Namespace (cache volume below); macOS stays hosted.
        os: [namespace-profile-perttu, macos-latest]
        go-version: ['1.25']

    steps:
    - uses: actions/checkout@v5

    # Namespace cache volume: Go module/build cache and npm cache persist on the
    # runner's attached disk. Soft-fails to a cold run if no volume is attached.
    - name: Resolve home for cache paths
      if: startsWith(matrix.os, 'namespace-')
      run: echo "CI_HOME=$HOME" >> "$GITHUB_ENV"

    - name: Namespace cache volume
      if: startsWith(matrix.os, 'namespace-')
      continue-on-error: true
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1.4.3
      with:
        path: |
          ${{ env.CI_HOME }}/go/pkg/mod
          ${{ env.CI_HOME }}/.cache/go-build
          ${{ env.CI_HOME }}/.npm

    # setup-go/setup-node GitHub caches only where there is no cache volume (macOS).
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: ${{ !startsWith(matrix.os, 'namespace-') }}

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: ${{ !startsWith(matrix.os, 'namespace-') && 'npm' || '' }}
        cache-dependency-path: ui/package-lock.json

    # Release-style builds explicitly embed the generated UI. Ordinary module
    # consumers use the tracked fallback and do not need Node artifacts.
    - name: Build UI (embedded in binary)
      run: npm ci && npm run build
      working-directory: ui

    - name: Test UI
      run: npx vitest run --fileParallelism=false
      working-directory: ui

    - name: Install dependencies
      run: go mod download

    - name: Build
      run: go build -tags ui_dist -v -o bin/openexec ./cmd/openexec

    - name: Test
      run: go test -v ./...

    - name: Compatibility Regression
      run: make compat-test

    # Advisory until the pre-existing backlog is cleared: golangci-lint
    # reports 142 historical issues (errcheck/unused/staticcheck) that
    # predate the lint gate ever running (CI previously failed at Build,
    # so this step never executed). New code must keep
    # `golangci-lint run` clean locally; do not add to the backlog.
    - name: Lint
      uses: golangci/golangci-lint-action@v8
      continue-on-error: true
      with:
        version: latest
