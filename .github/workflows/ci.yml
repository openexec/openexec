name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub forces JS actions onto Node 24 on 2026-06-16; opt in now so any
# breakage (golangci-lint-action@v8 still declares Node 20) surfaces while
# we're watching, not on the flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    # The binary embeds the React UI (//go:embed all:ui/dist in assets.go)
    # and ui/dist is gitignored, so the UI must be built before any Go
    # compile step or the embed fails with "no matching files found".
    - name: Build UI (embedded in binary)
      run: npm ci && npm run build
      working-directory: ui

    - name: Install dependencies
      run: go mod download

    - name: Build
      run: go build -v -o bin/openexec ./cmd/openexec

    - name: Test
      run: go test -v ./...

    - name: Compatibility Regression
      run: make compat-test

    # Advisory until the pre-existing backlog is cleared: golangci-lint
    # reports 142 historical issues (errcheck/unused/staticcheck) that
    # predate the lint gate ever running (CI previously failed at Build,
    # so this step never executed). New code must keep
    # `golangci-lint run` clean locally; do not add to the backlog.
    - name: Lint
      uses: golangci/golangci-lint-action@v8
      continue-on-error: true
      with:
        version: latest
